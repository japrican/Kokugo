// ============================================================
// PWA SETUP (manifest + service worker + install prompt)
// ============================================================
(function() {
  // 1. manifest.json を動的に生成してリンク
  const manifest = {
    name: PWA_APP_NAME,
    short_name: PWA_APP_SHORT_NAME,
    description: PWA_APP_DESC,
    start_url: "./",
    display: "standalone",
    background_color: PWA_BG_COLOR,
    theme_color: PWA_THEME_COLOR,
    orientation: "portrait",
    icons: [
      { src: "data:image/png;base64," + PWA_ICON_192, sizes: "192x192", type: "image/png", purpose: "any maskable" },
      { src: "data:image/png;base64," + PWA_ICON_512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
    ]
  };
  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const manifestURL = URL.createObjectURL(manifestBlob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);

  // 2. iOS用のホーム画面アイコン・メタタグ
  const appleIcon = document.createElement('link');
  appleIcon.rel = 'apple-touch-icon';
  appleIcon.href = "data:image/png;base64," + PWA_ICON_192;
  document.head.appendChild(appleIcon);

  const metaCapable = document.createElement('meta');
  metaCapable.name = 'apple-mobile-web-app-capable';
  metaCapable.content = 'yes';
  document.head.appendChild(metaCapable);

  const metaStatusBar = document.createElement('meta');
  metaStatusBar.name = 'apple-mobile-web-app-status-bar-style';
  metaStatusBar.content = 'black-translucent';
  document.head.appendChild(metaStatusBar);

  const metaTitle = document.createElement('meta');
  metaTitle.name = 'apple-mobile-web-app-title';
  metaTitle.content = PWA_APP_SHORT_NAME;
  document.head.appendChild(metaTitle);

  const metaTheme = document.createElement('meta');
  metaTheme.name = 'theme-color';
  metaTheme.content = PWA_THEME_COLOR;
  document.head.appendChild(metaTheme);

  // 3. ホーム画面に追加していない場合に案内を表示（iOS Safari向け）
  function isInStandaloneMode() {
    return ('standalone' in window.navigator) && (window.navigator.standalone);
  }
  function isIOS() {
    return /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
  }

  function showInstallHint() {
    if (isInStandaloneMode()) return; // すでにホーム画面から起動している
    if (localStorage.getItem('pwa_install_hint_dismissed')) return;
    if (!isIOS()) return; // 今回はiOS Safari向けの案内のみ実装

    const hint = document.createElement('div');
    hint.id = 'pwa-install-hint';
    hint.style = `
      position: fixed; left: 16px; right: 16px; bottom: 56px;
      background: white; border: 2px solid ${PWA_THEME_COLOR};
      border-radius: 16px; padding: 14px 16px; z-index: 10000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      font-family: 'Zen Maru Gothic', sans-serif;
      display: flex; align-items: center; gap: 10px;
    `;
    hint.innerHTML = `
      <div style="flex:1; font-size:12px; line-height:1.6; color:#1c1c1a;">
        <strong>📲 ホーム画面に追加</strong>すると、アプリのように使えます。<br>
        下の<strong>共有ボタン</strong>（□と↑）→「ホーム画面に追加」をタップ。
      </div>
      <button id="pwa-hint-close" style="background:none;border:none;font-size:18px;cursor:pointer;color:#9ca3af;flex-shrink:0;">✕</button>
    `;
    document.body.appendChild(hint);
    document.getElementById('pwa-hint-close').onclick = function() {
      hint.remove();
      localStorage.setItem('pwa_install_hint_dismissed', 'true');
    };
  }

  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(showInstallHint, 2000);
  });
})();

body{background:var(--off-white)!important;color:var(--ink);-webkit-font-smoothing:antialiased}
.home-title,.grade-name,.era-name,.hub-grade-title,.hub-era-title,.hub-mode-label,.ep-card-title,.m-cover-title,.header-title,
.quiz-question,.result-label,.th-continue b,.result-score{font-family:'M PLUS Rounded 1c','Noto Sans JP',sans-serif!important;font-feature-settings:"palt"}
.home-series,.grade-section-label,.era-section-label,.hub-progress-label,.m-cover-series,.m-grammar-label,.m-insight-label,.quiz-ep-label,.ep-num,
.back-btn,.header-badge,.lang-toggle-btn,.quiz-trigger-btn,.quiz-next-btn,.result-btn,.m-cover-ep,.m-footer-num,.hub-dot,.era-period,.era-badge,.grade-lock-badge{
  font-family:'Noto Sans JP',sans-serif!important}

/* ヘッダー */
.app-header,#screen-quiz .app-header{background:rgba(255,253,248,.94)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--th-line)!important;box-shadow:0 2px 12px rgba(43,53,70,.05)}
.header-title{color:var(--ink)!important}
.back-btn{background:var(--th-card)!important;border:1.5px solid var(--th-line)!important;color:var(--ink)!important;letter-spacing:0!important;font-size:13px!important}
.back-btn:hover{border-color:var(--subj)!important;color:var(--subj-d)!important}
.header-badge{background:var(--subj-bg)!important;color:var(--subj-d)!important;letter-spacing:.04em!important}
.lang-toggle-btn{background:var(--subj-bg)!important;border:1.5px solid var(--subj)!important;color:var(--subj-d)!important;box-shadow:none!important;letter-spacing:0!important}
.quiz-trigger-btn{background:var(--subj)!important;box-shadow:0 3px 0 var(--subj-d)!important;letter-spacing:.02em!important;font-size:12px!important}

/* ホーム */
#screen-home{background:var(--off-white)!important}
.home-hero-img,#home-hero-img,.home-icon{display:none!important}
.portal-link-btn{background:var(--th-card)!important;border:1.5px solid var(--th-line)!important;color:var(--ink)!important;box-shadow:var(--shadow-sm)}
.th-hero{position:relative;width:100%;max-width:520px;margin:4px auto 6px;height:210px;border-radius:28px;
  background:radial-gradient(120% 120% at 85% 10%,#fff 0%,var(--subj-bg) 55%);box-shadow:var(--shadow-sm);overflow:hidden}
.th-hero::before{content:'';position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:var(--subj);opacity:.12}
.th-hero .th-icon{position:absolute;left:50%;top:50%;width:178px;height:178px;transform:translate(-62%,-50%);filter:drop-shadow(0 14px 18px rgba(43,53,70,.18))}
.th-hero .th-pair{position:absolute;right:18px;bottom:16px;display:flex}
.th-hero .th-pair img{width:66px;height:66px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 6px 14px rgba(43,53,70,.15);background:#fff}
.th-hero .th-pair img+img{margin-left:-16px}
.th-hero .th-pair img:not([src]),.th-hero .th-pair img[src=""]{display:none}
.home-logo{margin-bottom:18px!important}
.home-series{color:var(--subj-d)!important;letter-spacing:.24em!important}
.home-title{color:var(--ink)!important;font-weight:800!important}
.home-title span{color:var(--subj)!important}
.home-sub{background:var(--subj-bg)!important;color:var(--ink)!important;font-weight:700!important}
.grade-section-label,.era-section-label{background:transparent!important;color:var(--gray)!important;letter-spacing:.12em!important}
.th-continue{width:100%;max-width:520px;margin:0 auto 14px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;
  background:var(--th-card);border:0;border-radius:20px;padding:14px 14px 14px 16px;box-shadow:0 0 0 2px var(--subj) inset,var(--shadow-sm);font-family:inherit;color:var(--ink)}

.th-continue small{display:block;font-size:12px;font-weight:700;color:var(--subj-d);letter-spacing:.06em}

.th-continue span.go{margin-left:auto;flex-shrink:0;background:var(--subj);color:#fff;border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px;box-shadow:0 4px 0 var(--subj-d)}
.grade-card{border:0!important;background:var(--th-card)!important;box-shadow:var(--shadow-sm)!important;border-radius:20px!important;position:relative}

.grade-card.selected{box-shadow:0 0 0 2px var(--subj) inset,var(--shadow-sm)!important}
.grade-name{color:var(--ink)!important;font-weight:800!important}
.era-card{border:0!important;box-shadow:var(--shadow-sm)!important;border-radius:20px!important}
.era-card.selected{box-shadow:0 0 0 2px var(--subj) inset,var(--shadow-sm)!important}
.era-badge{border-radius:100px!important;padding:3px 8px!important;font-size:10px!important;-webkit-text-stroke:0!important}

/* 学年ハブ */
.hub-hero{background:radial-gradient(120% 120% at 90% 0%,#fff 0%,var(--subj-bg) 60%)!important;border:0!important;border-radius:24px!important;box-shadow:var(--shadow-sm)}

.hub-progress-label{color:var(--subj-d)!important;letter-spacing:.1em!important}
.hub-dot{border-radius:8px!important;border-color:var(--th-line)!important}

.ep-card-title{color:var(--ink)!important;font-weight:800!important}
.ai-card{background:var(--ink)!important}

.m-cover{background:radial-gradient(120% 120% at 90% 0%,#fff 0%,var(--subj-bg) 60%)!important;border:0!important;border-radius:24px!important;box-shadow:var(--shadow-sm)}
.m-cover-series,.m-cover-title .hl{color:var(--subj-d)!important}

.m-split-half.edo-side{border-right:0!important;border-bottom:1px solid var(--th-line)!important}
.m-scene{background:var(--subj)!important}
.m-narr{background:#45698d!important}

.m-sfx{text-shadow:2px 2px 0 rgba(43,53,70,.25)!important}
.m-box{border:1px solid var(--th-line)!important}
.m-badge{border:0!important}

.m-footer{background:var(--subj)!important;box-shadow:0 5px 0 var(--subj-d)!important;border-radius:18px!important}

<script>
const APP_ID = 'kokugo';
// ============================================================
// TRIAL & UNLOCK SYSTEM (7-day free trial → paid unlock)
// APP_ID は各アプリのHTMLで個別に定義される（例: 'math', 'kokugo'）
// ============================================================
const TRIAL_DAYS = 7;
const UNLOCK_STORAGE_KEY = 'app_unlocked_' + (typeof APP_ID !== 'undefined' ? APP_ID : 'default');
const BUNDLE_UNLOCK_KEY = 'bundle_unlocked_v1';
const TRIAL_START_KEY = 'app_trial_start_' + (typeof APP_ID !== 'undefined' ? APP_ID : 'default');

function initTrialSystem() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('unlock') === 'yes') {
    // この教科だけを解放
    localStorage.setItem(UNLOCK_STORAGE_KEY, 'true');
  }
  if (params.get('unlock') === 'bundle') {
    // 全教科セット購入 → 全アプリ共通のキーを解放
    // (同一オリジンなので、どのアプリで実行しても全アプリに反映される)
    localStorage.setItem(BUNDLE_UNLOCK_KEY, 'true');
  }
  if (!localStorage.getItem(TRIAL_START_KEY)) {
    localStorage.setItem(TRIAL_START_KEY, Date.now().toString());
  }
}

function isUnlocked() {
  return localStorage.getItem(UNLOCK_STORAGE_KEY) === 'true'
      || localStorage.getItem(BUNDLE_UNLOCK_KEY) === 'true';
}

function getTrialDaysLeft() {
  const start = parseInt(localStorage.getItem(TRIAL_START_KEY) || Date.now().toString());
  const elapsed = Date.now() - start;
  const daysElapsed = elapsed / (1000 * 60 * 60 * 24);
  return Math.max(0, Math.ceil(TRIAL_DAYS - daysElapsed));
}

function isTrialActive() {
  return getTrialDaysLeft() > 0;
}

function isContentAccessible() {
  return isUnlocked() || isTrialActive();
}

      </a>
      <a href="https://buy.stripe.com/fZu7sE1oQdzu41S1DU5wI01" style="display:block; background:#fde68a; color:#1c1c1a; text-decoration:none; font-family:'Noto Sans JP',sans-serif; font-weight:900; font-size:14px; padding:13px; border-radius:100px;">
        ✨ 全教科セットで購入する
      </a>
    </div>
  `;
  document.body.appendChild(overlay);
}

function showTrialBanner() {
  const daysLeft = getTrialDaysLeft();
  if (isUnlocked()) return;
  const accentColor = (typeof PWA_THEME_COLOR !== 'undefined') ? PWA_THEME_COLOR : '#7c3aed';
  const banner = document.createElement('div');
  banner.id = 'trial-banner';
  banner.style = `
    position: fixed; bottom: 0; left: 0; right: 0;
    background: white; color: ${accentColor}; text-align: center;
    padding: 10px 16px; font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px; font-weight: 700; z-index: 9998;
    border-top: 3px solid ${accentColor};
    box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
  `;
  banner.textContent = daysLeft > 0
    ? `🎁 無料体験 残り${daysLeft}日`
    : `🔒 無料体験が終了しました`;
  document.body.appendChild(banner);
  document.body.style.paddingBottom = '50px';
}

    conceptText:"<strong>主語</strong>は文の中で「何が・誰が」を表す部分（〜が・〜は）。<strong>述語</strong>は「どうする・どんなだ・何だ」を表す部分で、通常文末にある。「美しい花が、公園に咲いている」では、「美しい」は花を修飾する語（連体修飾語）であり主語ではない。主語を探すときは「〜が」に注目し、その後ろに修飾語が続いていないか確認することが重要。",
    vocab:[["主語", "「〜が・は」にあたる部分"], ["述語", "「どうする」等にあたる部分"], ["修飾語", "他の語を詳しく説明する語"], ["文の成分", "文を構成する役割を持つ部分"], ["連体修飾語", "名詞を修飾する語"]],
    quiz:[{q:"「白い犬が、元気に走る」の主語はどれか？",opts:["白い", "犬が", "元気に", "走る"],ans:1,exp:"主語は「犬が」です。「白い」は犬を修飾する連体修飾語です。"},{q:"「白い犬が、元気に走る」の述語はどれか？",opts:["白い", "犬が", "元気に", "走る"],ans:3,exp:"述語は文末にある「走る」で、「どうする」にあたる部分です。"},{q:"主語を見分けるときに注目するべき助詞は？",opts:["を・に", "が・は", "で・と", "の・から"],ans:1,exp:"主語は通常「〜が」「〜は」という形で示されます。"}]
  },
  {
    id:2,title:"文の成分②（修飾語・接続語・独立語）",subtitle:"主語・述語以外の重要なパーツ",keyword:"修飾語・接続語・独立語",
    scene:"📍 国語の授業・「とても」「だから」「ああ」の役割",
    char1:{icon:"🙋",name:"ユイ",line:"「とても寒いので、コートを着た」の「とても」と「ので」は、それぞれ何という文の成分ですか？"},
    char2:{icon:"🧑‍🏫",name:"国語先生",line:"「とても」は「寒い」を詳しくする修飾語、「ので」を含む「寒いので」全体が後ろの文とつながる接続語です。"},
    conceptLabel:"修飾語・接続語・独立語",
    conceptPattern:"修飾語：他の語を詳しく説明 / 接続語：文や語句をつなぐ / 独立語：他と直接結びつかない",
    conceptText:"<strong>修飾語</strong>は他の語（主に主語・述語）を詳しく説明する文の成分（とても寒い）。<strong>接続語</strong>は前後の文や語句をつなぐ役割を持つ成分（寒いので＝理由→結果）。<strong>独立語</strong>は他の成分と直接結びつかず、感動・呼びかけ・応答などを表す（ああ、きれいだ）。文の成分は主語・述語・修飾語・接続語・独立語の5種類に分けられる。",
    vocab:[["修飾語", "他の語を詳しく説明する成分"], ["接続語", "文・語句をつなぐ成分"], ["独立語", "他と直接結びつかない成分"], ["連用修飾語", "用言を修飾する語"], ["文の成分の5種類", "主語・述語・修飾語・接続語・独立語"]],
    quiz:[{q:"「ああ、きれいな夕日だ」の「ああ」は何の成分か？",opts:["主語", "修飾語", "接続語", "独立語"],ans:3,exp:"「ああ」は感動を表し、他の成分と直接結びつかない独立語です。"},{q:"「雨が降ったので、運動会は中止になった」の「ので」を含む部分は何の成分か？",opts:["主語", "修飾語", "接続語", "独立語"],ans:2,exp:"前の文（理由）と後ろの文（結果）をつなぐ役割を持つため、接続語です。"},{q:"文の成分は主語・述語・接続語・独立語の他に何があるか？",opts:["品詞語", "修飾語", "活用語", "自立語"],ans:1,exp:"文の成分は主語・述語・修飾語・接続語・独立語の5種類です。"}]
  },
  {
    id:3,title:"単文・重文・複文",subtitle:"文の構造を3つに分類する",keyword:"単文・重文・複文",
    scene:"📍 国語の授業・文の構造を見分ける",
    char1:{icon:"🙋",name:"ユイ",line:"「私は本を読み、姉は音楽を聞いた」という文は、主語と述語のペアが2つありますよね？これは特別な構造ですか？"},
    char2:{icon:"🧑‍🏫",name:"国語先生",line:"そうです。主語・述語の関係が2つ並んでいる文を重文と呼びます。1つだけなら単文、一方が他方を説明する関係なら複文です。"},
    conceptLabel:"単文・重文・複文の違い",
    conceptPattern:"単文：主語・述語が1組 / 重文：対等な主語・述語が2組以上 / 複文：主語・述語の組が1つを修飾",
    conceptText:"<strong>単文</strong>は主語・述語の関係が1つだけの文（私は本を読む）。<strong>重文</strong>は対等な関係の主語・述語が2組以上並ぶ文（私は本を読み、姉は音楽を聞いた）。<strong>複文</strong>は主語・述語の組み合わせのうち、一方が他方を修飾する関係になっている文（私が読んだ本は面白かった＝「私が読んだ」が「本」を修飾）。",
    vocab:[["単文", "主語・述語が1組の文"], ["重文", "対等な主語・述語が2組以上の文"], ["複文", "主語・述語の組が修飾関係にある文"], ["節", "文の中の主語・述語のまとまり"], ["対等な関係", "重文の特徴"]],
    quiz:[{q:"「私は本を読み、姉は音楽を聞いた」はどの文の構造か？",opts:["単文", "重文", "複文", "これらに当てはまらない"],ans:1,exp:"対等な主語・述語の関係が2組並んでいるため、重文です。"},{q:"「私が読んだ本は面白かった」はどの文の構造か？",opts:["単文", "重文", "複文", "これらに当てはまらない"],ans:2,exp:"「私が読んだ」が「本」を修飾する関係になっているため、複文です。"},{q:"単文の特徴は？",opts:["主語・述語の関係が1つだけ", "主語・述語の関係が2つ以上対等にある", "修飾関係がある", "必ず短い文である"],ans:0,exp:"単文は主語・述語の関係が1つだけのシンプルな文です。"}]
  },
  {
    id:4,title:"自立語と付属語の識別",subtitle:"単語を見分ける応用問題",keyword:"自立語・付属語の識別",
    scene:"📍 国語の授業・文を単語に分けて品詞を判定する",
    char1:{icon:"🙋",name:"ユイ",line:"「きれいだ」の「きれい」と「だ」は、別の単語として分けるんですか？1つの形容動詞だと思っていました。"},
    char2:{icon:"🧑‍🏫",name:"国語先生",line:"「きれいだ」は1つの形容動詞として扱います。語幹「きれい」と活用語尾「だ」を分けません。ただ「学生だ」の「だ」は名詞「学生」に付く助動詞として別の単語になります。"},
    conceptLabel:"自立語・付属語の見分け方の応用",
    conceptPattern:"形容動詞の「だ」は活用語尾（分けない） / 名詞+「だ」の「だ」は助動詞（分ける）",
    conceptText:"自立語・付属語の識別で混乱しやすいのが「だ」の扱い。<strong>形容動詞</strong>（きれいだ・静かだ）の「だ」は活用語尾の一部で、語幹と分けずに1単語として扱う。一方、<strong>名詞</strong>に「だ」が付く場合（学生だ・本だ）は、「だ」は<strong>断定の助動詞</strong>として別の単語になる。見分け方は、その語が単独で名詞として使えるかどうかがポイント。",
    vocab:[["活用語尾", "活用して変化する部分"], ["断定の助動詞", "「だ・である」（名詞に付く）"], ["語幹", "活用しても変わらない部分"], ["識別問題", "入試で頻出の文法問題"], ["形容動詞と名詞+だ", "混同しやすい例"]],
    quiz:[{q:"「彼は学生だ」の「だ」の品詞は？",opts:["形容動詞の一部", "断定の助動詞", "形容詞", "副詞"],ans:1,exp:"名詞「学生」に付く「だ」は断定の助動詞で、独立した1単語です。"},{q:"「この部屋は静かだ」の「静かだ」は何品詞か？",opts:["名詞＋助動詞", "形容動詞（1語）", "形容詞", "副詞＋助動詞"],ans:1,exp:"「静かだ」は語幹「静か」と活用語尾が一体化した形容動詞で、1つの単語です。"},{q:"「だ」が断定の助動詞か形容動詞の一部かを見分けるポイントは？",opts:["文の長さ", "前の語が名詞か、独立して意味を持つ語幹か", "発音", "文末か文中か"],ans:1,exp:"前の語が単独で名詞として使えるなら「だ」は断定の助動詞、語幹（きれい等）と一体なら形容動詞の一部です。"}]
  },
  {
    id:5,title:"動詞の活用の応用（活用形の識別）",subtitle:"文中の動詞がどの活用形か見抜く",keyword:"活用形の識別",
    scene:"📍 国語の授業・文中の動詞の活用形を探す",
    char1:{icon:"🙋",name:"ユイ",line:"「もし雨が降れば、中止だ」の「降れば」って、活用形は何ですか？「降る」のままじゃないですよね？"},
    char2:{icon:"🧑‍🏫",name:"国語先生",line:"「降れば」は仮定形です。「ば」が続くときは仮定形になります。文中の動詞は、後ろに続く言葉に注目すると活用形がわかります。"},
    conceptLabel:"活用形を見分けるポイント",
    conceptPattern:"未然形→ない・う / 連用形→た・ます / 終止形→言い切り / 連体形→体言 / 仮定形→ば / 命令形→言い切りの命令",
    conceptText:"文中の動詞の活用形は、<strong>後ろに続く言葉</strong>に注目すると見分けられる。「ない・う・よう」に続けば<strong>未然形</strong>、「た・て・ます」に続けば<strong>連用形</strong>、言い切りなら<strong>終止形</strong>、名詞（体言）に続けば<strong>連体形</strong>、「ば」に続けば<strong>仮定形</strong>、命令の言い切りなら<strong>命令形</strong>。文末か文中かだけでなく、後続の語を確認することが重要。",
    vocab:[["未然形の目印", "ない・う・よう"], ["連用形の目印", "た・て・ます"], ["連体形の目印", "体言（名詞）"], ["仮定形の目印", "ば"], ["後続の語", "活用形を見分ける手がかり"]],
    quiz:[{q:"「行けば」の活用形は？",opts:["未然形", "連用形", "仮定形", "命令形"],ans:2,exp:"「ば」に続いているため仮定形です。"},{q:"「行く人」の「行く」の活用形は？",opts:["終止形", "連体形", "仮定形", "未然形"],ans:1,exp:"後ろに体言（人）が続いているため連体形です。終止形と同じ形ですが役割が異なります。"},{q:"動詞の活用形を見分けるために最も重要な手がかりは？",opts:["文の長さ", "後ろに続く言葉", "主語の種類", "文の意味"],ans:1,exp:"活用形は、その動詞の後ろにどんな言葉が続くかで判断します。"}]
  },
  {
    id:6,title:"助詞の識別（紛らわしい「の」「で」）",subtitle:"同じ形でも意味が違う助詞",keyword:"助詞の識別",
    scene:"📍 国語の授業・「私の本」と「走るのが速い」の「の」を比較",
    char1:{icon:"🙋",name:"ユイ",line:"「私の本」と「走るのが速い」の「の」は、同じ助詞ですか？意味が全然違う気がします。"},
    char2:{icon:"🧑‍🏫",name:"国語先生",line:"良い視点です。「私の本」の「の」は所有を表す格助詞、「走るのが」の「の」は「こと・もの」に言い換えられる準体助詞的なはたらきをする「の」です。同じ「の」でも意味・用法が違います。"},
    conceptLabel:"「の」「で」の識別",
    conceptPattern:"「の」：所有・主語代用・体言の代用など複数の意味 / 「で」：場所・手段の格助詞、断定の助動詞「だ」の連用形など",
    conceptText:"助詞の識別問題で頻出なのが「の」と「で」。<strong>「の」</strong>には所有（私の本）、主語の代用（雨の降る日＝雨が降る日）、体言の代用（走るのが速い＝走ることが）などの意味がある。<strong>「で」</strong>は場所・手段を表す格助詞（電車で行く）の他に、断定の助動詞「だ」の連用形（学生で、ある）としても使われる。見分けるには言い換えや文脈の確認が必要。",
    vocab:[["体言の代用", "「の」が「こと・もの」の意味になる用法"], ["格助詞の「で」", "場所・手段を表す"], ["助動詞の「で」", "「だ」の連用形"], ["識別問題", "入試の頻出パターン"], ["言い換え", "意味を確認する方法"]],
    quiz:[{q:"「走るのが好きだ」の「の」を言い換えるとどうなるか？",opts:["こと", "もの", "これ", "ある"],ans:0,exp:"この「の」は「こと」に言い換えられる、体言の代用としてのはたらきをしています。"},{q:"「彼は医者で、私は教師だ」の「で」の品詞は？",opts:["格助詞", "断定の助動詞「だ」の連用形", "接続助詞", "副助詞"],ans:1,exp:"この「で」は名詞「医者」に付く断定の助動詞「だ」の連用形です。"},{q:"「公園で遊ぶ」の「で」の品詞は？",opts:["格助詞", "断定の助動詞", "接続助詞", "終助詞"],ans:0,exp:"場所を示す「で」は格助詞です。"}]
  },
  {
    id:7,title:"助動詞「そうだ・ようだ」（推定・様態・伝聞）",subtitle:"確信のない表現を見分ける",keyword:"そうだ・ようだ",
    scene:"📍 国語の授業・「雨が降りそうだ」と「雨が降るそうだ」の違い",
    char1:{icon:"🙋",name:"ユイ",line:"「雨が降りそうだ」と「雨が降るそうだ」、どちらも「そうだ」がついていますが、意味が違う気がします。"},
    char2:{icon:"🧑‍🏫",name:"国語先生",line:"鋭いです。「降りそうだ」は様子から判断する様態、「降るそうだ」は人から聞いた伝聞です。動詞の活用形が違う点に注目してください。"},
    conceptLabel:"そうだ・ようだの意味の識別",
    conceptPattern:"様態のそうだ：動詞の連用形＋そうだ（〜しそうだ） / 伝聞のそうだ：終止形＋そうだ（〜だそうだ）",
    conceptText:"<strong>「そうだ」</strong>には2つの意味がある：①<strong>様態</strong>（見た目・様子からの判断、動詞の連用形に接続：雨が降りそうだ）②<strong>伝聞</strong>（人から聞いた情報、終止形に接続：雨が降るそうだ）。<strong>「ようだ」</strong>も様態・推定（雨が降るようだ）の意味で使われる。接続する活用形の違いで様態か伝聞かを見分けるのがポイント。",
    vocab:[["様態", "様子から判断する意味"], ["伝聞", "人から聞いた情報という意味"], ["連用形に接続", "様態のそうだの目印"], ["終止形に接続", "伝聞のそうだの目印"], ["推定", "確信のない判断"]],
    quiz:[{q:"「明日は晴れそうだ」の「そうだ」の意味は？",opts:["様態", "伝聞", "断定", "過去"],ans:0,exp:"動詞「晴れ」（連用形）に接続しているため、様子からの判断を表す様態です。"},{q:"「明日は晴れるそうだ」の「そうだ」の意味は？",opts:["様態", "伝聞", "断定", "過去"],ans:1,exp:"動詞「晴れる」（終止形）に接続しているため、人から聞いた伝聞です。"},{q:"様態の「そうだ」が接続する動詞の活用形は？",opts:["未然形", "連用形", "終止形", "連体形"],ans:1,exp:"様態の「そうだ」は動詞の連用形に接続します（降り・晴れ等）。"}]
  },
  {
    id:8,title:"助動詞「らしい」「だ・である」",subtitle:"推定と断定の表現",keyword:"らしい・だ・である",
    scene:"📍 国語の授業・「らしい」の意味を考える",
    char1:{icon:"🙋",name:"ユイ",line:"「彼は忙しいらしい」の「らしい」って、形容詞の「〜らしい」（子供らしい）とは違うんですか？"},
    char2:{icon:"🧑‍🏫",name:"国語先生",line:"はい、別物です。「忙しいらしい」の「らしい」は推定の助動詞、「子供らしい」の「らしい」は性質や特徴を表す形容詞（の一部）として扱われます。"},
    conceptLabel:"らしい・だ・であるの識別",
    conceptPattern:"推定の助動詞「らしい」：根拠のある推測 / 形容詞の「らしい」：性質・特徴を表す",
    conceptText:"<strong>助動詞の「らしい」</strong>は何らかの根拠に基づく推定を表す（彼は忙しいらしい＝忙しそうな様子から判断）。<strong>形容詞の「らしい」</strong>はその性質・特徴を備えていることを表す（子供らしい・男らしい）。<strong>「だ・である」</strong>は断定の助動詞で、名詞や一部の語について「〜である」という判断を示す（これは本だ／本である）。",
    vocab:[["推定の助動詞らしい", "根拠のある推測を表す"], ["形容詞のらしい", "性質・特徴を表す"], ["断定の助動詞", "だ・である"], ["根拠", "推定の判断材料"], ["識別のポイント", "直前の語の種類を確認する"]],
    quiz:[{q:"「彼は忙しいらしい」の「らしい」の品詞は？",opts:["形容詞", "推定の助動詞", "形容動詞", "動詞"],ans:1,exp:"これは何らかの根拠に基づく推定を表す助動詞です。"},{q:"「彼は男らしい」の「らしい」の品詞は？",opts:["推定の助動詞", "形容詞（の一部）", "断定の助動詞", "副詞"],ans:1,exp:"この「らしい」は「男」の性質・特徴を表し、形容詞をつくる接尾語的な扱いになります。"},{q:"「これは本である」の「である」は何の意味を表すか？",opts:["推定", "断定", "様態", "伝聞"],ans:1,exp:"「である」は「だ」の改まった言い方で、断定の意味を表します。"}]
  },
  {
    id:9,title:"慣用句",subtitle:"特別な意味を持つ決まった言い回し",keyword:"慣用句",
    scene:"📍 国語の授業・「猫の手も借りたい」の意味を考える",
    char1:{icon:"🙋",name:"ユイ",line:"「猫の手も借りたい」って、本当に猫の手を借りたいわけじゃないですよね？"},
    char2:{icon:"🧑‍🏫",name:"国語先生",line:"その通りです。これは慣用句で「とても忙しい」という意味です。慣用句は言葉そのものの意味とは違う、特別な意味を持つ決まった言い回しです。"},
    conceptLabel:"慣用句の特徴",
    conceptPattern:"慣用句：2つ以上の語が結びつき、特別な意味を持つ決まった言い回し",

<script>function highlightDialogueTerms(text, vocabList) {
  if (!vocabList || vocabList.length === 0) return text;
  let result = text;
  const terms = vocabList.map(v => v[0]).filter(t => t && t.length >= 1);
  // 長い語句を先にマッチさせる（部分一致の衝突防止）
  const sorted = terms.slice().sort((a,b) => b.length - a.length);
  sorted.forEach(term => {
    // カッコ内の注記（例：「れる（recall）」）を除去して素の語句に
    const cleanTerm = term.split('（')[0].split('(')[0].trim();
    if (!cleanTerm) return;
    try {
      const escaped = cleanTerm.replace(/[.*+?^${}()|\[\]\\]/g, '\\$&');
      const regex = new RegExp('(' + escaped + ')', 'g');
      result = result.replace(regex, '<span class="dialogue-hl">$1</span>');
    } catch(e) {}
  });
  return result;
}

function wrapParens(text) {
  // （）や()の中身を改行禁止にして、入らなければ括弧ごと次の行に送る
  return text.replace(/([（(][^）)]*[）)])/g, '<span style="white-space:nowrap">$1</span>');
}

function formatPattern(text) {
  // 「/」区切りを改行に変換（スペースに挟まれた/のみ。g/cm³のような単位表記は対象外）
  return wrapParens(text.split(/\s+\/\s+/).join('<br>'));
}

let currentGradeId = 'g1';
let currentGrade = GRADES.find(g => g.id === 'g1');

let quizMap = JSON.parse(localStorage.getItem('kokugoQuizMap') || '{}');

let currentQuizIdx = 0;
let quizScore = 0;
let lastQuizGradeId = '';
let lastQuizEpIdx = 0;

// INIT HOME
// ============================================================
function applyGradeTheme(grade) {
  const r = document.documentElement.style;
  r.setProperty('--cur-accent', `var(--${grade.cls}-accent)`);
  r.setProperty('--cur-bg', `var(--${grade.cls}-bg)`);
}

function initGradeGrid() {
  const grid = document.getElementById('grade-grid');
  grid.innerHTML = GRADES.map(grade => {
    const readCount = (readMap[grade.id] || []).length;
    const total = grade.episodes.length;
    const locked = grade.locked;
    return `<div class="grade-card ${locked?'locked':''} ${grade.id===currentGradeId?'selected':''}" onclick="${locked?'':`selectGradeAndGo('${grade.id}')`}">
      <span class="grade-icon">${grade.icon}</span>
      <div class="grade-info">
        <div class="grade-name">${grade.name}</div>
        <div class="grade-sub">${grade.sub}${readCount>0?` ／ 📖 ${readCount}/${total}単元`:''}</div>
      </div>
      ${locked?'<div class="grade-lock-badge">準備中</div>':''}
    </div>`;
  }).join('');
}

function selectGrade(id) {
  currentGradeId = id;
  currentGrade = GRADES.find(g => g.id === id);
  applyGradeTheme(currentGrade);
  document.querySelectorAll('.grade-card').forEach(c => c.classList.remove('selected'));
  initGradeGrid();
}

function selectGradeAndGo(id) {
  if (GRADES.find(g => g.id === id).locked) return;
  selectGrade(id);
  goToHub();
}

function goToHub() {
  renderHub();
  showScreen('hub');
}

// ============================================================
// HUB
// ============================================================
function renderHub() {
  const grade = currentGrade;
  document.getElementById('hub-header-title').textContent = grade.name;
  document.getElementById('hub-icon').textContent = grade.icon;
  document.getElementById('hub-title').innerHTML = `${grade.icon} ${grade.name}<span>を学ぶ</span>`;
  document.getElementById('hub-sub').textContent = grade.sub;

  const read = readMap[grade.id] || [];
  const quiz = quizMap[grade.id] || {};
  const dots = document.getElementById('hub-dots');
  dots.innerHTML = grade.episodes.map((ep, i) => {
    const isRead = read.includes(i);
    const hasQuiz = quiz[i] !== undefined;
    const cls = hasQuiz ? 'quiz-done' : isRead ? 'read' : '';
    return `<div class="hub-dot ${cls}" onclick="readEp(${i})" title="${ep.keyword}">${i+1}</div>`;
  }).join('');

  document.getElementById('hub-prog-label').textContent = `📖 ${read.length}/${grade.episodes.length}単元学習済み`;
}

// ============================================================
// EPISODE LIST
// ============================================================
function showEpList() {
  const grade = currentGrade;
  const read = readMap[grade.id] || [];
  const quiz = quizMap[grade.id] || {};
  const body = document.getElementById('ep-list-body');
  body.innerHTML = grade.episodes.map((ep, i) => {
    const isRead = read.includes(i);
    const score = quiz[i];
    const badge = score !== undefined ? '✅' : isRead ? '📖' : '';
    return `<div class="ep-card ${isRead?'read':''}" onclick="readEp(${i})">
      <div class="ep-num">単元${String(ep.id).padStart(2,'0')}</div>
      <div class="ep-info">
        <div class="ep-card-title">${ep.title}</div>
        <div class="ep-card-sub">${ep.subtitle}${score!==undefined?' ／ クイズ '+score+'/3点':''}</div>
      </div>
      <div class="ep-badge">${badge}</div>
    </div>`;
  }).join('');
  showScreen('list');
}

// ============================================================
// READER
// ============================================================
function readEp(idx) {
  currentEpIdx = idx;
  const ep = currentGrade.episodes[idx];
  document.getElementById('reader-title').textContent = `📖 単元${ep.id} ${ep.keyword}`;
  document.getElementById('manga-content').innerHTML = buildLessonHtml(ep);
  if (!readMap[currentGradeId]) readMap[currentGradeId] = [];
  if (!readMap[currentGradeId].includes(idx)) {
    readMap[currentGradeId].push(idx);
    localStorage.setItem('kokugoReadMap', JSON.stringify(readMap));
  }
  showScreen('reader');
  document.getElementById('screen-reader').scrollTop = 0;
}

// ============================================================

  const c1 = ep.char1, c2 = ep.char2;

  <div class="m-cover">
    <div class="m-cover-series">${currentGrade.name} 国語文法ストーリー</div>
    <div class="m-cover-ep">📖 単元${ep.id}</div>
    <div class="m-cover-title">${ep.title}</div>
    <div class="m-cover-sub">${ep.subtitle}</div>
  </div>

  <div class="m-page">
    <div class="m-panel"><div class="panel-inner m-panel-inner">
      <div class="m-narr">今日のテーマ：<strong>${ep.keyword}</strong></div>
      <div class="m-narr accent right">先生と一緒に文法のしくみを解き明かそう！</div>
    </div></div>

    <div class="m-panel">
      <div class="m-scene">${ep.scene}</div>
      <div class="m-panel-inner">
        <div class="m-bubble-wrap">
          <div class="m-char-col"><div class="m-char-icon a">${getAvatarHTML(c1.name)}</div><div class="m-char-name">${c1.name}</div></div>
          <div class="m-bubble">${highlightDialogueTerms(c1.line, ep.vocab)}</div>
        </div>
        <div class="m-bubble-wrap right">
          <div class="m-char-col"><div class="m-char-icon b">${getAvatarHTML(c2.name)}</div><div class="m-char-name">${c2.name}</div></div>
          <div class="m-bubble">${highlightDialogueTerms(c2.line, ep.vocab)}</div>
        </div>
      </div>
    </div>

    <div class="m-grammar-box">
      <div class="m-grammar-label">${ep.conceptLabel}</div>
      <div class="m-grammar-pattern">${formatPattern(ep.conceptPattern)}</div>
      <div class="m-grammar-text">${ep.conceptText}</div>
    </div>

    <div class="m-vocab-box">
      <div class="m-vocab-label">📒 重要文法用語</div>
      <div class="m-vocab-grid">${vocabHtml}</div>
    </div>
  </div>

  <div class="m-footer" onclick="startQuizForCurrentEp()" style="cursor:pointer">
    <div class="m-footer-next">クイズで「${ep.keyword}」を確認しよう！ ▶</div>
    <div class="m-footer-num">単元${ep.id} / 了</div>
  </div>
</div>`;
}

// QUIZ
// ============================================================
function startQuizForCurrentEp() { startQuiz(currentGradeId, currentEpIdx); }
function startRandomQuiz() { startQuiz(currentGradeId, Math.floor(Math.random()*currentGrade.episodes.length)); }

function startQuiz(gradeId, epIdx) {
  lastQuizGradeId = gradeId;
  lastQuizEpIdx = epIdx;
  const grade = GRADES.find(g=>g.id===gradeId);
  const ep = grade.episodes[epIdx];
  currentQuiz = [...ep.quiz];
  currentQuizIdx = 0;
  quizScore = 0;
  ['quiz-question','quiz-options','quiz-feedback','quiz-next-btn','quiz-prog-bar','quiz-ep-label']
    .forEach(id => { document.getElementById(id).style.display=''; });
  document.getElementById('quiz-result').className = 'quiz-result';
  document.getElementById('quiz-ep-label').textContent = `🧪 ${grade.name} 単元${ep.id} 「${ep.keyword}」`;
  renderQuestion();
  showScreen('quiz');
}

function renderQuestion() {
  const q = currentQuiz[currentQuizIdx];
  document.getElementById('quiz-prog-bar').innerHTML =
    currentQuiz.map((_,i)=>`<div class="quiz-pd ${i<currentQuizIdx?'done':i===currentQuizIdx?'current':''}"></div>`).join('');
  document.getElementById('quiz-question').textContent = q.q;

  if (q.type === 'short') {
    document.getElementById('quiz-options').innerHTML = `
      <textarea id="short-answer-input" class="short-answer-input" placeholder="自分の言葉で説明してみよう（記述問題）" rows="3"></textarea>
      <button class="quiz-option" style="text-align:center;font-weight:900" onclick="answerShort()">✏️ 解答を確認する</button>`;
  } else {
    document.getElementById('quiz-options').innerHTML =
      q.opts.map((o,i)=>`<button class="quiz-option" onclick="answer(${i})">${o}</button>`).join('');
  }
  document.getElementById('quiz-feedback').className = 'quiz-feedback';
  document.getElementById('quiz-next-btn').className = 'quiz-next-btn';
}

function answerShort() {
  const q = currentQuiz[currentQuizIdx];
  const input = document.getElementById('short-answer-input');
  input.disabled = true;
  document.querySelector('#quiz-options .quiz-option').disabled = true;
  const fb = document.getElementById('quiz-feedback');
  fb.className = 'quiz-feedback correct-fb show';
  fb.innerHTML = `📝 模範解答：<strong>${q.ans}</strong><br>${q.exp}<br><span style="font-size:12px;color:#6b7280">※記述問題は自己採点です。考え方が合っていればOK！</span>`;
  quizScore++; // 記述は自己採点なので満点扱いでカウント（自分で判断）
  document.getElementById('quiz-next-btn').className='quiz-next-btn show';
}

function answer(chosen) {
  const q = currentQuiz[currentQuizIdx];
  document.querySelectorAll('.quiz-option').forEach(o=>o.disabled=true);
  const fb = document.getElementById('quiz-feedback');
  if (chosen===q.ans) {
    document.querySelectorAll('.quiz-option')[chosen].classList.add('correct');
    fb.className='quiz-feedback correct-fb show';
    fb.innerHTML=`⭕ 正解！<br>${q.exp}`;
    quizScore++;
  } else {
    document.querySelectorAll('.quiz-option')[chosen].classList.add('wrong');
    document.querySelectorAll('.quiz-option')[q.ans].classList.add('correct');
    fb.className='quiz-feedback wrong-fb show';
    fb.innerHTML=`❌ 不正解。正解は「${q.opts[q.ans]}」<br>${q.exp}`;
  }
  document.getElementById('quiz-next-btn').className='quiz-next-btn show';
}

function nextQuestion() {
  currentQuizIdx++;
  if(currentQuizIdx>=currentQuiz.length) showResult();
  else renderQuestion();
}

function showResult() {
  ['quiz-question','quiz-options','quiz-feedback','quiz-next-btn','quiz-prog-bar','quiz-ep-label']
    .forEach(id=>{ document.getElementById(id).style.display='none'; });
  const grade = GRADES.find(g=>g.id===lastQuizGradeId);
  const ep = grade.episodes[lastQuizEpIdx];
  if(!quizMap[lastQuizGradeId]) quizMap[lastQuizGradeId]={};
  quizMap[lastQuizGradeId][lastQuizEpIdx]=quizScore;
  localStorage.setItem('kokugoQuizMap',JSON.stringify(quizMap));
  const stamps=['😢','😅','😊','🎉'];
  const labels=['もう一度読んでみよう！','もう少し！','よくできました！','満点！パーフェクト！'];
  const si=quizScore===3?3:quizScore>=2?2:quizScore===1?1:0;
  document.getElementById('result-stamp').textContent=stamps[si];
  document.getElementById('result-score').textContent=`${quizScore}/3`;
  document.getElementById('result-label').textContent=labels[si];
  document.getElementById('result-sub').textContent=`${grade.name} 単元${ep.id}「${ep.keyword}」のクイズ結果`;
  document.getElementById('quiz-result').className='quiz-result show';
}

function retryQuiz() { startQuiz(lastQuizGradeId,lastQuizEpIdx); }

function showScreen(name) {
  initTrialSystem();
  if (!isContentAccessible() && name !== 'home') {
    showUnlockOverlay(PURCHASE_URL);
  }
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  window.scrollTo(0,0);
  if(name==='home') initGradeGrid();
  if(name==='hub') renderHub();
}

<script id="mikata-theme-js">
(function(){
  var C={"T": "KOKUGO_TEACHER_B64", "S": "MIA_AVATAR_B64", "read": "kokugoReadMap", "gvar": "currentGradeId", "list": "GRADES", "sel": "selectGrade"};
  function g(n){try{return eval(n)}catch(e){return undefined}}
  function setPair(){
    var t=document.getElementById('thT'),s=document.getElementById('thS');
    var T=g(C.T),S=g(C.S);if(t&&T)t.src=T;if(s&&S)s.src=S;
  }
  var KEY='mikata_last_'+C.read;
  function save(i){try{localStorage.setItem(KEY,JSON.stringify({g:g(C.gvar),i:i,t:Date.now()}))}catch(e){}}
  function renderContinue(){
    var el=document.getElementById('th-continue');if(!el)return;
    var last=null;try{last=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
    var list=g(C.list)||[];
    var grade=last&&list.find(function(x){return x.id===last.g});
    var ep=grade&&grade.episodes&&grade.episodes[last.i];
    if(!grade||!ep||grade.locked){el.hidden=true;return}
    el.innerHTML='<div><small>つづきから</small><b>'+grade.name+'・'+(ep.title||ep.keyword||'')+'</b></div><span class="go">読む ▶</span>';
    el.hidden=false;
    el.onclick=function(){var sel=g(C.sel);if(sel){sel(last.g)}var r=g('readEp');if(r)r(last.i)};
  }
  var orig=g('readEp');
  if(typeof orig==='function'){window.readEp=function(i){var r=orig.apply(this,arguments);save(i);return r}}
  var oshow=g('showScreen');
  if(typeof oshow==='function'){window.showScreen=function(n){var r=oshow.apply(this,arguments);if(n==='home')renderContinue();return r}}
  function init(){setPair();renderContinue()}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
  window.addEventListener('load',init);
})();
</script>
